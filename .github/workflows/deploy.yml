name: 🐍 Deploy Django to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            PROJECT_DIR="/var/www/html/zoikotelecom-python"
            VENV="$PROJECT_DIR/venv"

            # Fix ownership
            sudo chown -R lennox:lennox $PROJECT_DIR

            # Safe git directory
            git config --global --add safe.directory $PROJECT_DIR

            # Pull latest code
            cd $PROJECT_DIR
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # Ensure venv exists
            if [ ! -d "$VENV" ]; then
              python3 -m venv $VENV
            fi

            # Recreate venv if broken
            if [ ! -x "$VENV/bin/pip" ]; then
              echo "Recreating venv..."
              rm -rf $VENV
              python3 -m venv $VENV
            fi

            # Install dependencies
            $VENV/bin/pip install --upgrade pip --quiet
            $VENV/bin/pip install -r $PROJECT_DIR/requirements.txt --quiet

            # Django commands
            $VENV/bin/python $PROJECT_DIR/manage.py migrate --no-input
            $VENV/bin/python $PROJECT_DIR/manage.py collectstatic --no-input

            # Restart service
            sudo systemctl restart zoikotelecom-django

            echo "✅ Django deployment complete!"