<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>New Contact Message</title></head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:40px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <tr><td style="background:#0e1929;padding:32px 40px;text-align:center;">
          <h1 style="margin:0;color:#fff;font-size:24px;font-weight:700;">ZOIKO <span style="color:#e6007e;">MOBILE</span></h1>
        </td></tr>
        <tr><td style="padding:40px 40px 24px;">
          <h2 style="margin:0 0 16px;color:#0e1929;font-size:22px;">New Contact Message</h2>

          <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8f9fa;border-radius:8px;margin-bottom:24px;">
            <tr><td style="padding:12px 16px;font-size:13px;font-weight:700;color:#0e1929;border-bottom:1px solid #e9ecef;">Name</td><td style="padding:12px 16px;font-size:13px;color:#444;border-bottom:1px solid #e9ecef;">{{ name }}</td></tr>
            <tr><td style="padding:12px 16px;font-size:13px;font-weight:700;color:#0e1929;border-bottom:1px solid #e9ecef;">Email</td><td style="padding:12px 16px;font-size:13px;color:#444;border-bottom:1px solid #e9ecef;"><a href="mailto:{{ email }}" style="color:#0e8f74;">{{ email }}</a></td></tr>
            <tr><td style="padding:12px 16px;font-size:13px;font-weight:700;color:#0e1929;border-bottom:1px solid #e9ecef;">Phone</td><td style="padding:12px 16px;font-size:13px;color:#444;border-bottom:1px solid #e9ecef;">{{ phone }}</td></tr>
            <tr><td style="padding:12px 16px;font-size:13px;font-weight:700;color:#0e1929;border-bottom:1px solid #e9ecef;">Subject</td><td style="padding:12px 16px;font-size:13px;color:#444;border-bottom:1px solid #e9ecef;">{{ subject }}</td></tr>
            <tr><td style="padding:12px 16px;font-size:13px;font-weight:700;color:#0e1929;">Received</td><td style="padding:12px 16px;font-size:13px;color:#444;">{{ created_at }}</td></tr>
          </table>

          <h3 style="margin:0 0 8px;color:#0e1929;font-size:16px;">Message</h3>
          <div style="background:#f8f9fa;border-radius:8px;padding:16px;color:#444;font-size:14px;line-height:1.6;white-space:pre-wrap;">{{ message }}</div>
        </td></tr>
        <tr><td style="background:#f4f4f5;padding:24px 40px;text-align:center;">
          <p style="margin:0;color:#aaa;font-size:12px;">&copy; Zoiko Mobile &middot; <a href="https://zoikomobile.co.uk" style="color:#aaa;">zoikomobile.co.uk</a></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
